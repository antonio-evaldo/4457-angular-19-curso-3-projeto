<section class="transacoes-card">
  <h2 class="titulo">Movimentação financeira</h2>

  <div class="corpo-card">
    <ul class="transacoes">
      @for (transacao of transacoes(); track transacao.id) {
        <li>
          <app-transacao [transacao]="transacao" />
        </li>
      } @empty {
        <li aria-hidden="true">
          Ainda não há transações.
        </li>
      }
    </ul>

    <button class="botao-adicionar-transacao">Adicionar transação</button>
  </div>
</section>
