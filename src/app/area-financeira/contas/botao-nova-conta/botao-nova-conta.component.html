<app-botao (click)="abrirModal()">
  <img src="icones/carteira.svg" alt="" class="icone-carteira">
  Adicionar conta
</app-botao>

<app-modal [(aberto)]="modalAberto">
  <ng-container ngProjectAs="[modal-cabecalho]" class="modal-cabecalho">
    <img src="icones/carteira.svg" alt="">
    <h2 class="text-xl">Adicionar conta bancária</h2>
  </ng-container>

  <form class="form text-md" (ngSubmit)="aoSubmeter()" ngNativeValidate>
    <label class="label-grupo">
      Banco
      <input [(ngModel)]="novaContaForm.nome" class="input" type="text" name="nome-banco">
    </label>

    <label class="label-grupo">
      Saldo
      <input [(ngModel)]="novaContaForm.valor" class="input" type="number" name="saldo-banco" min="0" step="0.01" placeholder="R$ 100,00" required>
    </label>

    <app-botao class="botao-adicionar-conta">
      Adicionar
    </app-botao>
  </form>
</app-modal>
